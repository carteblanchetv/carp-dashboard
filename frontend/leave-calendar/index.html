<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Leave Overview | Restricted Access</title>
    <meta name="description" content="Secure internal leave management system for authorised personnel.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css?v=5.1.0">
</head>
<body>
    
    <!-- Dashboard Screen -->
    <main id="dashboard-screen" class="container fade-in">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
            <div>
                <h1 class="text-gradient">Editorial Leave Overview</h1>
                <p id="current-month-display" style="color: var(--text-muted); font-size: 1.1rem;"></p>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button id="add-leave-btn" class="btn btn-primary">
                    <span>+</span> Add Leave
                </button>
                <button id="admin-login-trigger" class="btn btn-secondary">Admin Login</button>
                <button id="logout-btn" class="btn btn-secondary hidden">Logout</button>
            </div>
        </header>

        <div style="display: grid; grid-template-columns: 1fr 300px; gap: 2rem;">
            <!-- Calendar Section -->
            <section class="glass-card" style="padding: 1.5rem;">
                <div class="calendar-controls" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <div style="display: flex; gap: 0.5rem;">
                        <button id="prev-month" class="btn btn-secondary" style="padding: 0.5rem 1rem;">&lt;</button>
                        <button id="next-month" class="btn btn-secondary" style="padding: 0.5rem 1rem;">&gt;</button>
                    </div>
                    <div id="calendar-header-title" style="font-weight: 700; font-size: 1.25rem;"></div>
                </div>
                
                <div id="calendar-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 0.5rem;">
                    <!-- Days of week -->
                    <div class="day-label">Sun</div>
                    <div class="day-label">Mon</div>
                    <div class="day-label">Tue</div>
                    <div class="day-label">Wed</div>
                    <div class="day-label">Thu</div>
                    <div class="day-label">Fri</div>
                    <div class="day-label">Sat</div>
                    <!-- Calendar days will be injected here -->
                </div>
            </section>

            <!-- Sidebar / Stats -->
            <aside>
                <div class="glass-card" style="padding: 1.5rem; margin-bottom: 1.5rem;">
                    <h3 style="margin-bottom: 1rem;">Upcoming Leave</h3>
                    <div id="active-leaves-list" style="display: flex; flex-direction: column; gap: 1rem;">
                        <!-- List items will be injected here -->
                        <p style="color: var(--text-muted); font-size: 0.875rem;">No one currently on leave.</p>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <!-- Admin Login Modal -->
    <div id="admin-modal" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 110; backdrop-filter: blur(4px);">
        <div class="glass-card fade-in" style="width: 100%; max-width: 400px; padding: 2.5rem; text-align: center;">
            <h2 class="text-gradient" style="margin-bottom: 1.5rem;">Admin Access</h2>
            <form id="login-form">
                <div style="margin-bottom: 1.25rem; text-align: left;">
                    <label for="access-code" style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text-muted);">Admin Code</label>
                    <input type="password" id="access-code" required placeholder="••••••••" class="input-field" style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-sm); color: white;">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Unlock Admin Tools</button>
                <p id="login-error" class="hidden" style="color: var(--accent); margin-top: 1rem; font-size: 0.875rem;">Invalid access code.</p>
                <button type="button" id="close-admin-modal" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Add Leave Modal -->
    <div id="leave-modal" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px);">
        <div class="glass-card fade-in" style="width: 100%; max-width: 500px; padding: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2 class="text-gradient">Request Leave</h2>
                <button id="close-modal" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.5rem;">&times;</button>
            </div>
            
            <form id="leave-form">
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text-muted);">Name</label>
                    <input type="text" id="leave-name" required class="input-field" style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-sm); color: white;">
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text-muted);">Start Date</label>
                        <input type="date" id="leave-start" required class="input-field" style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-sm); color: white;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text-muted);">End Date</label>
                        <input type="date" id="leave-end" required class="input-field" style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-sm); color: white;">
                    </div>
                </div>

                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text-muted);">Type</label>
                    <select id="leave-type" class="input-field" style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-sm); color: white;">
                        <option value="editorial">Editorial Leave</option>
                    </select>
                </div>

                <div style="margin-bottom: 2rem; padding: 0.75rem; background: rgba(56, 189, 248, 0.1); border-radius: var(--radius-sm); border: 1px solid var(--primary);">
                    <p style="font-size: 0.8rem; color: var(--primary); text-align: center;">
                        ⚠️ Note: Editorial Leave on Mondays or Fridays is subject to approval.
                    </p>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Request</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
